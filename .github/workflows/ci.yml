name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Unit suite (tests/v3)
        run: uv run --with pyyaml python tests/v3/run_all.py

      - name: Golden recall eval
        run: uv run --with pyyaml python evals/run_eval.py
