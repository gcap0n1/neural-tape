[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-tape"
version = "3.3.0"
description = "Agent-agnostic layered memory for AI coding agents: transcript capture, LLM classification, SQLite episodes and Obsidian-friendly archive"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
keywords = ["memory", "ai-agents", "claude-code", "codex", "grok", "transcripts", "sqlite", "obsidian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
neuraltape = "neuraltape.cli:main"

[tool.setuptools]
packages = ["neuraltape", "lex", "lex.v3", "lex.v3.adapters", "lex.v22"]